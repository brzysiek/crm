{% extends 'settings/_layout.html' %}
{% from '_icons.html' import icon %}
{% block settings_content %}

<div class="page-header">
  <h2>{{ title }}</h2>
  <a href="{{ url_for('settings.email_settings') }}" class="btn btn-outline">{{ icon('arrow-left', 14) }} Wróć</a>
</div>

<div class="settings-section">
  <form method="post" action="{{ action }}" id="footer-form">

    <div class="form-group">
      <label for="name">Nazwa stopki <span class="req">*</span></label>
      <input type="text" id="name" name="name" required value="{{ footer.name or '' }}"
             placeholder="np. Stopka standardowa">
    </div>

    <div class="form-group">
      <label>Treść stopki (HTML) <span class="req">*</span></label>
      <div id="footer-editor-wrap"></div>
      <input type="hidden" id="html_content" name="html_content">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Zapisz stopkę</button>
      <a href="{{ url_for('settings.email_settings') }}" class="btn btn-outline">Anuluj</a>
    </div>
  </form>
</div>

{% endblock %}

{% block scripts %}
<script>
initHtmlEditor('footer-editor-wrap', 'footer-editor-body', 'html_content',
  {{ (footer.html_content or '') | tojson }}, [], { allowFooterInsert: false });
</script>
{% endblock %}
