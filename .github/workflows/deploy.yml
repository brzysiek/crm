name: Deploy to cyberfolks

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/brzychu/crm
            # fetch + reset, nie pull: pull wywraca sie na rozjechanej historii
            # (np. po force-pushu) i zostawia serwer na nieistniejacym commicie.
            # reset --hard dociaga stan origin/main bez wzgledu na to, co serwer
            # mial wczesniej; plikow nieśledzonych (uploady, tmp) nie rusza.
            git fetch origin main
            git reset --hard FETCH_HEAD
            source /home/brzychu/virtualenv/crm/3.13/bin/activate
            pip install -r requirements.txt
            mkdir -p tmp
            touch tmp/restart.txt
